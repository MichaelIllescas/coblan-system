# Copiar como application.properties y completar con valores propios.
# Los valores se leen de variables de entorno; los que están después de ":" son defaults para desarrollo local.

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coblan?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Clave para firmar los JWT (mínimo 256 bits en Base64)
jwt.secret=${JWT_SECRET:cambiar-por-una-clave-segura}

security.whitelist=/auth/**,/swagger-ui.html,/swagger-ui/**,/v3/api-docs/**
security.cors-allowed-origins=${CORS_ORIGINS:http://localhost:5173}
security.cors-allowed-paths=/auth/forgot-password,/auth/reset-password

# Envío de emails (recuperación de contraseña)
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:usuario@example.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.socketFactory.port=${MAIL_PORT:465}
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.protocol=smtp

app.frontend.reset-password-url=${RESET_PASSWORD_URL:http://localhost:5173/reset-password}
